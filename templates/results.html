<!DOCTYPE html>
<html>
<head>
    <title>Результаты поиска - Geniigg</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #ffcc00;
            text-align: center;
            margin-bottom: 10px;
        }
        .search-form {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            text-align: center;
        }
        .search-form input {
            padding: 12px 15px;
            width: 60%;
            font-size: 1rem;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 30px 0 0 30px;
            color: white;
            outline: none;
        }
        .search-form button {
            padding: 12px 25px;
            font-size: 1rem;
            background: #ffcc00;
            color: #1a1a1a;
            border: none;
            border-radius: 0 30px 30px 0;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-form button:hover {
            background: #e6b800;
        }
        .mode-toggle a {
            color: #4da6ff;
            text-decoration: none;
            background: #252525;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }
        .video-card {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }
        .video-card .title {
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            color: #fff;
        }
        .video-card a {
            text-decoration: none;
            color: inherit;
        }
        .video-player {
            margin: 30px 0;
            text-align: center;
        }
        video {
            max-width: 100%;
            border-radius: 12px;
            background: #000;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4da6ff;
            text-decoration: none;
            background: #252525;
            padding: 8px 20px;
            border-radius: 30px;
            transition: background 0.2s;
        }
        .back-link:hover {
            background: #333;
        }
        .no-results {
            text-align: center;
            margin: 40px 0;
            font-size: 1.1rem;
            color: #aaa;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: #555;
        }
        .video-wrapper {
            position: relative;
            margin-top: 20px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .quality-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(4px);
            transition: opacity 0.2s;
            display: none;
        }
        .video-wrapper:hover .quality-btn {
            display: block;
        }
        .quality-menu {
            position: absolute;
            top: 45px;
            right: 12px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 5px 0;
            min-width: 100px;
            z-index: 20;
            display: none;
            flex-direction: column;
        }
        .quality-menu a {
            color: #eee;
            padding: 8px 15px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        .quality-menu a:hover {
            background: #ffcc00;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 Поиск видео</h1>

    <div class="search-form">
        <form method="GET" action="{{ url_for('results') }}">
            <input type="text" name="q" placeholder="Введите тему урока" value="{{ query or '' }}" required>
            <button type="submit">Найти</button>
            <input type="hidden" name="week" value="{{ current_week }}">
        </form>
    </div>

    {% if videos %}
        <div class="video-grid">
            {% for v in videos %}
            <div class="video-card">
                <a href="#" class="video-link" data-video-id="{{ v.video_id }}">
                    <img src="{{ v.thumbnail }}" alt="{{ v.title }}">
                    <div class="title">{{ v.title }}</div>
                </a>
            </div>
            {% endfor %}
        </div>
    {% elif query %}
        <div class="no-results">😞 По запросу "{{ query }}" ничего не найдено.</div>
    {% else %}
        <div class="no-results">🔎 Введите тему для поиска видеоуроков.</div>
    {% endif %}

    <!-- Контейнер для плеера -->
    <div id="video-container" class="video-wrapper" style="display: none;">
        <video id="search-video" controls></video>
        <button id="quality-btn" class="quality-btn">⚙️ Качество</button>
        <div id="quality-menu" class="quality-menu"></div>
    </div>

    <div style="text-align: center;">
        <a href="{{ url_for('home', week=current_week) }}" class="back-link">← Вернуться к расписанию</a>
    </div>
</div>

<script>
    (function() {
        const videoContainer = document.getElementById('video-container');
        const videoElement = document.getElementById('search-video');
        const qualityBtn = document.getElementById('quality-btn');
        const qualityMenu = document.getElementById('quality-menu');
        let currentVideoId = null;
        let currentQualities = [];

        async function loadQualities(videoId) {
            try {
                const response = await fetch(`/api/qualities/${videoId}`);
                if (!response.ok) return [];
                const data = await response.json();
                return data.qualities || [];
            } catch (error) {
                console.error('Ошибка загрузки качеств:', error);
                return [];
            }
        }

        function buildQualityMenu(qualities) {
            qualityMenu.innerHTML = '';
            if (!qualities.length) return;
            qualities.forEach(q => {
                const option = document.createElement('a');
                option.textContent = q.quality;
                option.onclick = (e) => {
                    e.preventDefault();
                    const newSrc = `/proxy/${currentVideoId}?quality=${q.quality}`;
                    videoElement.src = newSrc;
                    videoElement.load();
                    videoElement.play().catch(e => console.log('play error', e));
                    qualityMenu.style.display = 'none';
                };
                qualityMenu.appendChild(option);
            });
        }

        async function playVideo(videoId) {
            currentVideoId = videoId;
            const qualities = await loadQualities(videoId);
            currentQualities = qualities;
            buildQualityMenu(qualities);
            let videoUrl = `/proxy/${videoId}`;
            if (qualities.length) {
                videoUrl += `?quality=${qualities[0].quality}`;
            }
            videoElement.src = videoUrl;
            videoContainer.style.display = 'block';
            videoElement.load();
            videoElement.play().catch(e => console.log('autoplay failed', e));
        }

        document.querySelectorAll('.video-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const videoId = link.dataset.videoId;
                playVideo(videoId);
            });
        });

        if (qualityBtn && qualityMenu) {
            qualityBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isVisible = qualityMenu.style.display === 'flex';
                qualityMenu.style.display = isVisible ? 'none' : 'flex';
            });
            document.addEventListener('click', (e) => {
                if (!qualityBtn.contains(e.target) && !qualityMenu.contains(e.target)) {
                    qualityMenu.style.display = 'none';
                }
            });
        }
    })();
</script>
</body>
</html>
